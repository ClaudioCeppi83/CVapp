<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
	<defs>
		<linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
			<stop offset="0%" stop-color="#F2E3C6"/>
			<stop offset="35%" stop-color="#D4AF37"/>
			<stop offset="70%" stop-color="#C5A880"/>
			<stop offset="100%" stop-color="#8C704F"/>
		</linearGradient>
		<linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
			<stop offset="0%" stop-color="#181716"/>
			<stop offset="100%" stop-color="#0B0A09"/>
		</linearGradient>
		<filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
			<feGaussianBlur stdDeviation="5" result="blur"/>
			<feComposite in="SourceGraphic" in2="blur" operator="over"/>
		</filter>
	</defs>

	<!-- Fondo Squircle Elegante -->
	<rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
	<rect width="502" height="502" x="5" y="5" rx="123" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-opacity="0.45"/>

	<!-- Monograma "CC" Estilizado (Hospitality & Tech Dual Craft) -->
	<g fill="url(#goldGrad)" filter="url(#subtleGlow)" font-family="'Cormorant Garamond', 'Times New Roman', Georgia, serif" font-weight="700">
		<text x="160" y="340" font-size="300" text-anchor="middle" letter-spacing="-10">C</text>
		<text x="330" y="340" font-size="270" text-anchor="middle" opacity="0.95">C</text>
	</g>

	<!-- Acento de Fusión: Diamante Central -->
	<polygon points="256,380 264,395 256,410 248,395" fill="url(#goldGrad)"/>
</svg>
